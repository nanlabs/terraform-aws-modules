version: 2
updates:
  # Terraform modules and examples
  - package-ecosystem: "terraform"
    directories:
      - "/modules/*"
      - "/modules/*/examples/*"
      - "/examples/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "terraform"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
